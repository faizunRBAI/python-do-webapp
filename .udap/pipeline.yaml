version: 1
name: python-do-webapp
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: pip install flake8
      - name: Run flake8
        run: flake8 . --max-line-length=120 --exclude=migrations,venv,.venv,staticfiles

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test --verbosity=2
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-prod"
          DATABASE_URL: "sqlite:///test.db"
          DEBUG: "True"

  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: sfo3
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          region="${host%%.*}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="endpoint=${AWS_ENDPOINT_URL_S3}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
        working-directory: infra
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra
      - name: Get Droplet IP
        id: get_ip
        run: |
          ip=$(terraform output -raw droplet_ip)
          echo "droplet_ip=${ip}" >> "$GITHUB_OUTPUT"
        working-directory: infra

    outputs:
      droplet_ip: ${{ steps.get_ip.outputs.droplet_ip }}

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get Droplet IP from state
        id: get_ip
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          region="${host%%.*}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="endpoint=${AWS_ENDPOINT_URL_S3}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
          ip=$(terraform output -raw droplet_ip)
          echo "droplet_ip=${ip}" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Install Ansible
        run: pip install ansible-core
      - name: Install Ansible collections
        run: ansible-galaxy collection install community.general
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Scan host keys
        run: ssh-keyscan -H "${{ steps.get_ip.outputs.droplet_ip }}" >> ~/.ssh/known_hosts
      - name: Generate inventory
        run: |
          cat > /tmp/inventory.ini << EOF
          [web]
          ${{ steps.get_ip.outputs.droplet_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key
          EOF
      - name: Run Ansible playbook
        run: |
          ansible-playbook -i /tmp/inventory.ini ansible/site.yml
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

  - id: verify
    kind: verify
    needs: [configure, provision]
    timeout_minutes: 10
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get Droplet IP from state
        id: get_ip
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          region="${host%%.*}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="endpoint=${AWS_ENDPOINT_URL_S3}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
          ip=$(terraform output -raw droplet_ip)
          echo "droplet_ip=${ip}" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Health check
        run: |
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.droplet_ip }}/

rollback:
  strategy: manual
