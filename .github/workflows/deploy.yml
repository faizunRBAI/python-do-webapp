      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Init (read outputs)
      run: "cd infra\nhost=\"${AWS_ENDPOINT_URL_S3#https://}\"\nregion=\"${host%%.*}\"\
        \nterraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=${region}\" \\\n \
        \ -backend-config=\"skip_credentials_validation=true\" \\\n  -backend-config=\"\
