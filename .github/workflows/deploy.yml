        \ \\\n  -backend-config=\"skip_region_validation=true\" \\\n  -backend-config=\"\
        skip_s3_checksum=true\" \\\n  -backend-config=\"use_path_style=true\"\n"
    - name: Get Droplet IP
      run: 'cd infra

        echo "DROPLET_IP=$(terraform output -raw droplet_ip)" >> "$GITHUB_ENV"

        '
    - name: Health check
      run: 'curl --fail --retry 12 --retry-delay 15 --retry-all-errors http://$DROPLET_IP/

        '
