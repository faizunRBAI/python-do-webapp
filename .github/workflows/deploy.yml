name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linting tools
      run: pip install flake8
    - name: Run flake8
      run: flake8 . --max-line-length=120 --exclude=migrations,venv,.venv
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
