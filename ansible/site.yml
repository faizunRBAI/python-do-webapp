---
- name: Configure Python Django Web Application
  hosts: web
  become: true
  gather_facts: true
  vars:
    app_dir: /opt/python-do-webapp
    app_user: webapp
    python_version: "3.11"
    gunicorn_port: 8000
    db_name: webapp_db
    db_user: webapp_user
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    secret_key: "{{ lookup('env', 'SECRET_KEY') }}"
    project_name: "{{ lookup('env', 'PROJECT_NAME') }}"

  tasks:
    # ── Wait for SSH ───────────────────────────────────────────────────────
    - name: Wait for port 22 to be available
      ansible.builtin.wait_for:
        port: 22
        host: "{{ inventory_hostname }}"
        timeout: 120
      delegate_to: localhost
      become: false

    # ── System prerequisites ───────────────────────────────────────────────
    - name: Update apt cache (plain refresh, no cache_valid_time)
      ansible.builtin.apt:
        update_cache: true

    - name: Install software-properties-common for PPA support
      ansible.builtin.apt:
        name: software-properties-common
        state: present

    - name: Add deadsnakes PPA (Python 3.11 on Ubuntu 22.04)
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present
        update_cache: true

    # ── System packages ────────────────────────────────────────────────────
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - python3.11
          - python3.11-venv
          - python3.11-dev
          - python3-pip
          - postgresql
          - postgresql-contrib
          - libpq-dev
          - nginx
          - git
          - curl
        state: present
        update_cache: false

    # ── App user ───────────────────────────────────────────────────────────
    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /bin/bash
        create_home: true
        home: "{{ app_dir }}"

    # ── PostgreSQL setup ───────────────────────────────────────────────────
    - name: Ensure PostgreSQL is started and enabled
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Create PostgreSQL database
      community.general.postgresql_db:
        name: "{{ db_name }}"
        state: present
      become_user: postgres
      no_log: false

    - name: Create PostgreSQL user
      community.general.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        db: "{{ db_name }}"
        priv: "ALL"
        state: present
      become_user: postgres
      no_log: true

    # ── App deployment ─────────────────────────────────────────────────────
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: preserve
      notify: Restart gunicorn

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3.11 -m venv "{{ app_dir }}/venv"
        creates: "{{ app_dir }}/venv/bin/activate"
      become_user: "{{ app_user }}"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_python: python3.11
      become_user: "{{ app_user }}"

    # ── Application environment ────────────────────────────────────────────
    - name: Write .env file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
        content: |
          SECRET_KEY={{ secret_key }}
          DEBUG=False
          DATABASE_URL=postgresql://{{ db_user }}:{{ db_password }}@localhost:5432/{{ db_name }}
          ALLOWED_HOSTS=*
          APP_ENV=production
      no_log: true
      notify: Restart gunicorn

    # ── Migrations & static files ──────────────────────────────────────────
    - name: Run database migrations
      ansible.builtin.command:
        cmd: "{{ app_dir }}/venv/bin/python manage.py migrate --noinput"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      environment:
        SECRET_KEY: "{{ secret_key }}"
        DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@localhost:5432/{{ db_name }}"
        DEBUG: "False"
        ALLOWED_HOSTS: "*"
      changed_when: true
      no_log: false

    - name: Collect static files
      ansible.builtin.command:
        cmd: "{{ app_dir }}/venv/bin/python manage.py collectstatic --noinput"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      environment:
        SECRET_KEY: "{{ secret_key }}"
        DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@localhost:5432/{{ db_name }}"
        DEBUG: "False"
        ALLOWED_HOSTS: "*"
      changed_when: true
      no_log: false

    # ── Gunicorn systemd service ───────────────────────────────────────────
    - name: Write Gunicorn systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/gunicorn.service
        mode: "0644"
        content: |
          [Unit]
          Description=Gunicorn daemon for python-do-webapp
          After=network.target postgresql.service

          [Service]
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_dir }}/.env
          ExecStart={{ app_dir }}/venv/bin/gunicorn \
            --workers 2 \
            --bind 127.0.0.1:{{ gunicorn_port }} \
            --timeout 60 \
            --access-logfile /var/log/gunicorn/access.log \
            --error-logfile /var/log/gunicorn/error.log \
            python_do_webapp.wsgi:application
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart gunicorn

    - name: Create Gunicorn log directory
      ansible.builtin.file:
        path: /var/log/gunicorn
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Gunicorn
      ansible.builtin.service:
        name: gunicorn
        state: started
        enabled: true

    # ── Nginx configuration ────────────────────────────────────────────────
    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Write Nginx vhost
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/webapp
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              client_max_body_size 20M;

              location /static/ {
                  alias {{ app_dir }}/staticfiles/;
                  expires 30d;
              }

              location / {
                  proxy_pass http://127.0.0.1:{{ gunicorn_port }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
          }
      notify: Reload nginx

    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/webapp
        dest: /etc/nginx/sites-enabled/webapp
        state: link
      notify: Reload nginx

    - name: Test Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # ── App port readiness ─────────────────────────────────────────────────
    - name: Wait for Gunicorn to be listening
      ansible.builtin.wait_for:
        port: "{{ gunicorn_port }}"
        host: 127.0.0.1
        timeout: 60

  handlers:
    - name: Restart gunicorn
      ansible.builtin.service:
        name: gunicorn
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
